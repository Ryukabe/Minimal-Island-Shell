source = $HOME/.config/colors/colors.conf

$CITY           = Dhaka
$COUNTRY        = Bangladesh
$WALLPAPER_PATH = $HOME/.config/hypr/hyprlock/wallpaper

background {
    path = $WALLPAPER_PATH
    blur_size = 5
    blur_passes = 3
    brightness = 0.6
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor = eDP-1
    size = 200, 35
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(250, 250, 250, 0.3)
    inner_color = rgba(250, 250, 250, 0.2)
    font_color = $fg
    font_family = Rubik bold
    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = $PAMFAIL
    check_color = $accent
    fail_color = $red
    capslock_color = $orange
    hide_input = false
    position = 0, -260
    halign = center
    valign = center
}

# HOURS
label {
    monitor = eDP-1
    text = cmd[update:1000] date +"%H"
    color = alpha($accent, 0.55)
    font_size = 100
    font_family = Rubik, SF Pro Display, sans-serif
    font_weight = 200
    position = -60, 550
    halign = center
    valign = middle
}

# DIVIDER LINE — minutes between hours 
shape {
    monitor = eDP-1
    type = rectangle
    size = 300, 3
    color = rgba(200, 200, 200, 0.30)
    position = 10, 560
    halign = center
    valign = middle
    rotate = 30
    xray = fales
}

# MINUTES
label {
    monitor = eDP-1
    text = cmd[update:1000] date +"%M"
    color = rgba(180, 180, 180, 0.40)
    font_size = 100
    font_family = Rubik, SF Pro Display, sans-serif
    font_weight = 200
    position = 80, 420
    halign = center
    valign = middle
}

# Profile Photo
image {
    monitor = eDP-1
    path = $HOME/.config/hypr/hyprlock/image/PFP.jpg
    color = rgba(250, 250, 250, 1.0)
    border_size = 0
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -120
    halign = center
    valign = center
}

# USER
label {
    monitor = eDP-1
    text = <b>$USER</b>
    text_aling = center
    color = $fg
    font_size = 20
    font_family =Rubik, SF Pro Display, JetBrainsMono Nerd Font Propo
    shadow_passes = 0
    shadow_size = 4
    position = 0, -200
    halign = center
    valign = center
}

