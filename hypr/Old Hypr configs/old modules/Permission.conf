ecosystem{
  no_update_news = true
  enforce_permissions = false
}

permission = /usr/bin/hyprshot, screencopy, allow

permission = /usr/(lib|libexc|lib64)/xdg-desktop-portal-hyprland, screencopy, ask

# Allow the built-in laptop keyboard
permission = at-translated-set-2-keyboard, keyboard, allow

# Allow your external/main keyboard (identified as sem-hct-keyboard in your logs)
permission = sem-hct-keyboard, keyboard, allow

# Allow related input controls for your external keyboard
permission = sem-hct-keyboard-consumer-control, keyboard, allow
permission = sem-hct-keyboard-system-control, keyboard, allow

# OPTIONAL: Deny all other unknown keyboard devices (Rubber Duckies, etc.)
# Make sure this is the LAST keyboard permission rule
permission = .*, keyboard, deny

