#/*-----Suprim Keys-----*/#
$mainMod = SUPER # Sets "Windows" key as main modifier

# kill
#bind = CTRL ALT, DELETE, killactive,
bind = CTRL ALT, DELETE, exec, hyprctl kill

#/*-----WorkSpaces-----*/#

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Floating windows
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod SHIFT, P, pseudo, # dwindle


#/*-----Apps-----*/# 

# Terminal
bind = $mainMod, RETURN, exec, $terminal

# Regular Use App
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $editor
bind = $mainMod, O, exec, obsidian --vault "My Vault"
bind = $mainMod, S, exec, spotify

#/*-----System Apps-----*/#

# Rofi 
bind = ALT, SPACE, exec, pkill rofi || rofi -show drun -theme $HOME/.config/rofi/applauncher.rasi
bind = $mainMod CTRL , SPACE, exec, pkill rofi || $HOME/.config/rofi/scripts/menu.sh

# Theme switcher
bind = $mainMod SHIFT, T, exec, $HOME/.config/themes/theme-switcher.sh

# Shutdown menu
bind = $mainMod, F4, exec, $HOME/.config/wlogout/scripts/wlogout.sh

# Lock screen
bind = $mainMod, L, exec, hyprlock -c $HOME/.config/hypr/hyprlock/hyprlock.conf

# Waybar
bind = $mainMod SHIFT, R, exec, $HOME/.config/waybar/scripts/relaunch.sh

# Swaync & Swaync centar
bind = $mainMod SHIFT, A, exec, swaync-client -R && swaync-client -rs
bind = $mainMod, A, exec, swaync-client -t

# Night light
bind = $mainMod, F5, exec, $HOME/.config/hypr/scripts/nightlight.sh

# Color Picker
bind = $mainMod, P, exec, hyprpicker -a -f hex

# Clipboard 
bind = $mainMod, V, exec, $HOME/.config/hypr/scripts/clipboard-toggle.sh
bind = $mainMod SHIFT, V, exec, cliphist wipe

# Screenshot
bind = $mainMod, Print, exec, hyprshot -m output -m eDP-1 -o $HOME/Pictures/Screenshot
bind = $mainMod SHIFT, Print, exec, hyprshot -m region -o $HOME/Pictures/Screenshot

#/*-----functions-----*/#

# brightness
bindel = ,XF86MonBrightnessUp, exec, $HOME/.config/hypr/scripts/brightness.sh --inc
bindel = ,XF86MonBrightnessdown, exec, $HOME/.config/hypr/scripts/brightness.sh --dec

# Extarnrl Keyoard Brightness Keys 
#bindel = ,F3, exec, $HOME/.config/hypr/scripts/brightness.sh --inc
#bindel = ,F2, exec, $HOME/.config/hypr/scripts/brightness.sh --dec


# Volume
bindel = ,XF86AudioRaiseVolume, exec, $HOME/.config/hypr/scripts/volume_wpctl.sh --inc
bindel = ,XF86AudioLowerVolume, exec, $HOME/.config/hypr/scripts/volume_wpctl.sh --dec
bindel = ,XF86AudioMute, exec, $HOME/.config/hypr/scripts/volume_wpctl.sh --toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# External Keyboard Volume keys
#bindel = ,F8, exec,$HOME/.config/hypr/scripts/volume_wpctl.sh --inc
#bindel = ,F7, exec, $HOME/.config/hypr/scripts/volume_wpctl.sh --inc
#bindel = ,F6, exec, $HOME/.config/hypr/scripts/volume_wpctl.sh --toggle
#bindel = ,F9, exec, $HOME/.config/hypr/scripts/volume_wpctl.sh --toggle

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Close Apps
bind = ALT, F4, killactive,

#Alt + Tab 
bind = ALT, TAB, exec, snappy-switcher next

