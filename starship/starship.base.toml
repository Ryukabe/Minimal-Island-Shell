# ~/.config/starship.toml
palette = "hermit"
palette = "hermit"

# Don't print a new line at the start of the prompt
add_newline = false

format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:hm_muted'

# Prompt Character configuration
[character]
success_symbol = "[ ](bold fg:hm_green)"
error_symbol = "[ ](bold fg:hm_red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:hm_purple"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:hm_purple)[$symbol $branch(:$remote_branch)](fg:hm_bg bg:hm_purple)[ ](bold fg:hm_purple)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold fg:hm_red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](fg:hm_green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:hm_fg bold fg:hm_bg)[](bold fg:hm_fg)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold fg:hm_green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:hm_fg fg:hm_bg"
style_root = "fg:hm_red bold"
format = "[](bold fg:hm_fg)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:hm_cyan fg:hm_bg"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:hm_cyan)[󰉋 → $path]($style)[](bold fg:hm_cyan)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:hm_yellow)[󰪢 $duration](bold bg:hm_yellow fg:hm_bg)[](bold fg:hm_yellow)'
