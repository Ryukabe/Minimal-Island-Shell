# ~/.config/alacritty/alacritty.toml

[terminal.shell]
program = "/usr/bin/fish"
args = ["-l"]

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
size = 11.0

[window]
padding = { x = 25, y = 25 }
opacity = 0.75
dimensions = { columns = 78, lines = 23 }

[cursor.style]
shape = "Block"
blinking = "Always"

[colors.cursor]
cursor = '#7daea3'   # Soft aqua/green accent instead of high-contrast white/gold
text = '#1d2021'     # Text inside the block

[bell]
duration = 0

[colors.primary]
background = '#1d2021'
foreground = '#d4be98'

[colors.normal]
black   = '#1d2021'
red     = '#ea6962'
green   = '#a9b665'
yellow  = '#d8a657'
blue    = '#7daea3'
magenta = '#d3869b'
cyan    = '#89b482'
white   = '#d4be98'

[colors.bright]
black   = '#928374'
red     = '#ea6962'
green   = '#a9b665'
yellow  = '#d8a657'
blue    = '#7daea3'
magenta = '#d3869b'
cyan    = '#89b482'
white   = '#dfbf8e'